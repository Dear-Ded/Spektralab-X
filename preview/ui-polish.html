<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0F0F0E">
<title>Spektralab-X · 界面预览</title>
<!--
  1:1 preview of the editor. 1 dp = 1 CSS px; the phone is 412 x 915.
  "codex 现版" keeps the current build's tokens (Theme.kt, Pill.kt, Sliders.kt).
  "打磨版" is the proposal. Springs run through a damped-spring solver with
  Compose's dampingRatio / stiffness; the aurora is Aura.kt's SKSL in WebGL;
  photos are graded by a WebGL stand-in for the engine.
  Serve the repository root over http (python -m http.server) and open
  /preview/ui-polish.html: fonts and sounds come from the app's own assets,
  and WebGL cannot read local images from file://.
-->
<style>
@font-face{font-family:UiSans;src:url(../app/src/main/assets/fonts/InstrumentSans-VF.ttf) format("truetype");font-weight:400 700;font-display:swap}
@font-face{font-family:UiNum;src:url(../app/src/main/assets/fonts/BarlowSemiCondensed-Regular.ttf) format("truetype");font-weight:400;font-display:swap}@font-face{font-family:UiNum;src:url(../app/src/main/assets/fonts/BarlowSemiCondensed-Medium.ttf) format("truetype");font-weight:500;font-display:swap}@font-face{font-family:UiNum;src:url(../app/src/main/assets/fonts/BarlowSemiCondensed-SemiBold.ttf) format("truetype");font-weight:600;font-display:swap}@font-face{font-family:UiNum;src:url(../app/src/main/assets/fonts/BarlowSemiCondensed-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:NotoSC;src:url(../app/src/main/assets/fonts/NotoSansSC-VF.ttf) format("truetype");font-weight:100 900;font-display:swap}
:root{
  --surround:#1E1E1E;--bg:#0E0E10;--surface:#141416;--panel:#1D1D1F;--panelHigh:#262628;--panelHighest:#303032;
  --on:#EBEBEB;--soft:#A8A8A8;--faint:#6E6E70;--outline:#3A3A3C;--track:#6A6A6C;--hair:#2A2A2C;--accent:#F2F2F2;--onAccent:#111113;
  --warn:#FF6B5E;--red:#E0533F;
  --sans:UiSans,NotoSC,system-ui,sans-serif;--mono:UiNum,NotoSC,ui-monospace,monospace;--num:UiNum,NotoSC,monospace;
  --fx:cubic-bezier(.2,.8,.25,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#060606;color:var(--on);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{display:flex;align-items:center;justify-content:center;gap:40px}
button,input{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{cursor:text}

/* ---------- console (desktop) ---------- */
#console{width:300px;height:915px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;gap:14px;font-size:13px;color:#a6a39c}
#console h1{font-size:16px;color:#ECE9E3;margin:0;font-weight:500}
#console .row{display:flex;gap:8px;flex-wrap:wrap}
.cbtn{height:34px;padding:0 14px;border-radius:17px;background:#1c1c1b;color:#ECE9E3;font-size:13px}
.cbtn.on{background:#EEEAE2;color:#161614}
#vswitch{display:flex;background:#1c1c1b;border-radius:20px;padding:3px;gap:3px}
#vswitch button{flex:1;height:34px;border-radius:17px;font-size:13px;transition:background .15s var(--fx),color .15s var(--fx)}
#vswitch button.on{background:#EEEAE2;color:#161614;font-weight:500}
#log{flex:1;min-height:120px;overflow:auto;background:#0b0b0a;border-radius:14px;padding:10px 12px;font:11px/1.7 var(--mono);color:#77746e}
#log b{color:#ECE9E3;font-weight:500}
#notes{font-size:12.5px;line-height:1.7;max-height:300px;overflow:auto;padding-left:18px;margin:0}
#notes li{margin-bottom:4px}

/* ---------- phone ---------- */
#phone{position:relative;width:412px;height:915px;border-radius:40px;overflow:hidden;background:var(--bg);
  box-shadow:0 0 0 9px #161615,0 0 0 10px #2b2a28,0 30px 90px rgba(0,0,0,.65);flex:none;
  font-size:14px;line-height:22px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#status{position:absolute;left:0;right:0;top:0;height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 28px;
  font:600 13px var(--sans);color:var(--on);z-index:60;pointer-events:none}
#status .r{display:flex;gap:6px;align-items:center}
#gesture{position:absolute;left:0;right:0;bottom:0;height:20px;display:flex;justify-content:center;align-items:center;z-index:60;pointer-events:none}
#gesture i{width:108px;height:4px;border-radius:2px;background:rgba(236,233,227,.6)}
#mfab{display:none}
@media (max-width:520px){
  body{display:block}
  #console{position:fixed;inset:auto 0 0 0;width:auto;height:auto;max-height:72vh;z-index:200;background:rgba(15,15,14,.97);
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;transform:translateY(110%);transition:transform .3s var(--fx)}
  #console.open{transform:none}
  #phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  #status{display:none}
  #mfab{display:block;position:fixed;top:calc(3px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:150;height:22px;padding:0 12px;border-radius:11px;
    background:rgba(0,0,0,.55);font:500 12px var(--sans);color:#ECE9E3}
  #app{padding-top:calc(env(safe-area-inset-top) + 28px)!important}
}

/* ---------- app ---------- */
.layer{position:absolute;inset:0}
#app{display:flex;flex-direction:column;padding-top:32px}
#topbar{height:56px;flex:none;display:flex;align-items:center;padding:0 4px 0 16px;background:var(--surface);transition:opacity .2s var(--fx)}
#topbar .t{flex:1;min-width:0}
#topbar .t1{font:600 16px/24px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .t2{font:12px/18px var(--sans);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:24px;position:relative;transition:background .12s}
.ib:active{background:rgba(255,255,255,.08)}
.ib svg{width:24px;height:24px;stroke:var(--on);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib[disabled]{opacity:.35;pointer-events:none}
#photoArea{touch-action:none;position:relative;flex:1;min-height:0;background:var(--surround);overflow:hidden}
#photoArea.empty{background:var(--bg)}
#aura{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .3s var(--fx)}
#photoArea.empty #aura{opacity:1}
#empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:32px}
#photoArea.empty #empty{display:flex}
.primary{height:52px;min-width:200px;padding:0 24px;border-radius:26px;background:var(--accent);color:var(--onAccent);font:600 16px var(--sans)}
.textbtn{height:48px;padding:0 16px;border-radius:24px;color:rgba(235,235,235,.85);font:500 14px var(--sans)}
.hint{font:12px/18px var(--sans);color:var(--soft)}
#stage{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
#photoArea:not(.empty) #stage{display:flex}
#frame{position:relative;transition:padding .25s var(--fx),background .25s var(--fx)}
#frame.paper{background:#f3f0e9;padding:14px 14px 36px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#frame.film{padding:24px 0;background:#0d0c0b}
#frame .perfs{position:absolute;left:0;right:0;height:24px;display:none;background-repeat:repeat-x;background-position:4px 50%}
#frame.film .perfs,#frame.perfonly .perfs{display:block}
#frame.perfonly{padding:24px 0;background:#0d0c0b}
#frame .perfs.t{top:0}#frame .perfs.b{bottom:0}
#frame .edge{position:absolute;left:14px;bottom:2px;font:600 7.5px/10px var(--mono);color:#d39a3e;letter-spacing:1.2px;display:none;opacity:.85}
#frame.film .edge{display:block}
#frame .date{position:absolute;right:20px;bottom:46px;font:500 13px var(--num);color:#ff8a3c;text-shadow:0 0 5px rgba(255,110,30,.9);display:none;letter-spacing:1px}
#frame.film .date{bottom:34px}
#frame.date .date{display:block}
#pic{position:relative;overflow:hidden;display:block;background:#000}
#pic canvas,#pic img{position:absolute;inset:0;width:100%;height:100%;display:block}
#cropGrid{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s var(--fx);
  background:linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.4) calc(33.33% - .5px),rgba(255,255,255,.4) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.67% - .5px),rgba(255,255,255,.4) calc(66.67% - .5px),rgba(255,255,255,.4) calc(66.67% + .5px),transparent calc(66.67% + .5px)),
    linear-gradient(180deg,transparent calc(33.33% - .5px),rgba(255,255,255,.4) calc(33.33% - .5px),rgba(255,255,255,.4) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.67% - .5px),rgba(255,255,255,.4) calc(66.67% - .5px),rgba(255,255,255,.4) calc(66.67% + .5px),transparent calc(66.67% + .5px));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
#cropGrid.on{opacity:1}
#cropGrid.fine{background-size:12.5% 12.5%,12.5% 12.5%;background-image:linear-gradient(90deg,rgba(255,255,255,.22) 1px,transparent 1px),linear-gradient(180deg,rgba(255,255,255,.22) 1px,transparent 1px)}
#cropGrid i{position:absolute;width:16px;height:16px;border:0 solid #fff}
#cropGrid i:nth-child(1){left:0;top:0;border-width:3px 0 0 3px}#cropGrid i:nth-child(2){right:0;top:0;border-width:3px 3px 0 0}
#cropGrid i:nth-child(3){left:0;bottom:0;border-width:0 0 3px 3px}#cropGrid i:nth-child(4){right:0;bottom:0;border-width:0 3px 3px 0}
#holdTag{position:absolute;top:12px;left:50%;transform:translateX(-50%);height:28px;padding:0 12px;border-radius:8px;background:rgba(0,0,0,.55);
  font:500 13px/28px var(--sans);display:none;color:#fff}
#chips{position:absolute;left:12px;bottom:12px;display:flex;gap:8px}
.ochip{height:36px;padding:0 14px;border-radius:8px;background:rgba(0,0,0,.45);color:rgba(255,255,255,.9);font:500 13px/36px var(--sans);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ochip.on{background:rgba(48,48,50,.9);color:var(--accent)}
#histo{position:absolute;right:12px;bottom:12px;width:120px;height:56px;border-radius:8px;background:rgba(0,0,0,.5);display:none}
#workline{position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,rgba(235,235,235,.8),transparent);
  background-size:40% 100%;background-repeat:no-repeat;display:none;animation:wl 1s linear infinite}
@keyframes wl{from{background-position:-60% 0}to{background-position:160% 0}}
#panel{flex:none;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;will-change:height;position:relative}
#handle{height:20px;flex:none;display:grid;place-items:center;touch-action:none;cursor:ns-resize}
#handle i{width:36px;height:4px;border-radius:2px;background:var(--outline)}
#pages{position:relative;flex:1;min-height:0;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:4px 20px 16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
#bar{flex:none;display:flex;align-items:center;padding:8px 12px 28px;background:var(--bg);gap:8px}
#cats{flex:1;height:64px;display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--hair);border-radius:32px}
.cat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:28px;color:var(--on);
  transition:background .12s var(--fx),color .12s var(--fx);position:relative}
.cat.on{background:var(--accent);color:var(--onAccent)}
.cat canvas{width:22px;height:22px}
.cat span{font:12px/18px var(--sans);margin-top:2px}
.cat .dot{position:absolute;top:9px;left:calc(50% + 8px)}
#save{height:48px;padding:0 14px;border-radius:24px;background:var(--accent);color:var(--onAccent);font:500 14px var(--sans);display:flex;align-items:center;gap:6px;position:relative}
#save[disabled]{background:rgba(242,242,242,.12);color:rgba(235,235,235,.38)}
.dot{width:6px;height:6px;border-radius:3px;background:var(--accent);display:inline-block;flex:none}
.on>.dot,.dot.onfill{background:var(--onAccent)}

.ph{display:flex;align-items:center;min-height:40px;gap:10px;padding-bottom:4px;flex:none}
.ph .tt{font:600 16px/24px var(--sans);white-space:nowrap}
.ph .sm{flex:1;min-width:0;font:14px/22px var(--sans);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quiet{height:40px;padding:0 12px;border-radius:20px;font:500 13px var(--sans);color:var(--on);flex:none}
.quiet:active{background:rgba(255,255,255,.08)}
.prow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:4px 20px;flex:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 20px,#000 calc(100% - 36px),transparent)}
.prow::-webkit-scrollbar,.cards::-webkit-scrollbar,.knobs::-webkit-scrollbar{display:none}
.pill{flex:none;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--hair);font:400 13px/38px var(--sans);color:var(--on);position:relative;
  transition:background .12s var(--fx),color .12s var(--fx),border-color .12s var(--fx);white-space:nowrap;display:flex;align-items:center;gap:6px}
.pill.on{background:var(--accent);color:var(--onAccent);border-color:var(--accent);font-weight:600}
.pill>.dot{position:absolute;top:5px;right:6px}
.pill.icon{width:40px;padding:0;justify-content:center}
.pill svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill.search{padding:0 6px 0 12px}
.pill.search input{width:140px;outline:0;font:inherit}
.cards{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:4px 20px;flex:none}
.card{flex:none;width:112px;display:flex;flex-direction:column;align-items:center;border-radius:16px}
.card .ring{width:112px;height:112px;padding:4px;border-radius:16px;border:2px solid transparent;position:relative;transition:border-color .12s var(--fx)}
.card.on .ring{border-color:var(--accent)}
.card .img{width:100%;height:100%;border-radius:12px;background:var(--panelHigh);overflow:hidden;position:relative}
.card .img canvas{width:100%;height:100%;display:block}
.card .chk{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:11px;background:var(--accent);display:none;place-items:center}
.card.on .chk{display:grid}
.card .chk svg{width:12px;height:12px;stroke:var(--onAccent);stroke-width:1.8;fill:none;stroke-linecap:round}
.card .star{position:absolute;bottom:6px;right:6px;width:20px;height:20px;border-radius:10px;background:rgba(0,0,0,.6);display:grid;place-items:center}
.card .nm{margin-top:6px;font:400 13px/20px var(--sans);padding:1px 8px;border-radius:8px;max-width:112px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .12s var(--fx),color .12s var(--fx)}
.card.on .nm{background:var(--accent);color:var(--onAccent);font-weight:600}
.card .sub{font:12px/18px var(--sans);color:var(--soft);max-width:112px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 4px}
.tcard{flex:none;width:136px;min-height:80px;border-radius:12px;background:var(--panel);border:1px solid var(--hair);padding:12px 14px;text-align:left;position:relative;
  transition:background .12s var(--fx),color .12s var(--fx)}
.tcard.on{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
.tcard b{display:block;font:400 13px/20px var(--sans)}
.tcard.on b{font-weight:600}
.tcard small{display:block;font:12px/18px var(--sans);opacity:.68;margin-top:4px}
.seg{display:flex;height:48px;background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:4px;gap:4px;flex:none}
.seg button{flex:1;border-radius:8px;font:400 13px var(--sans);position:relative;transition:background .12s var(--fx),color .12s var(--fx)}
.seg button.on{background:var(--accent);color:var(--onAccent);font-weight:600}
.seg button>.dot{position:absolute;top:6px;right:10px}
.srow{display:flex;align-items:center;min-height:56px;gap:12px;width:100%;text-align:left;flex:none}
.srow .l{flex:1}
.srow .l div{font:14px/22px var(--sans)}
.sw{width:52px;height:32px;border-radius:16px;background:var(--panelHigh);border:2px solid var(--outline);position:relative;transition:background .12s var(--fx),border-color .12s var(--fx);flex:none}
.sw i{position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:8px;background:var(--soft);transition:all .22s cubic-bezier(.3,1.35,.5,1)}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on i{left:22px;top:2px;width:24px;height:24px;border-radius:12px;background:var(--onAccent)}
.more{display:flex;align-items:center;min-height:48px;gap:8px;font:500 13px var(--sans);padding-top:4px;flex:none;width:100%}
.more .sp{flex:1}
.more svg{width:20px;height:20px;stroke:var(--soft);stroke-width:1.6;fill:none;stroke-linecap:round;transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.more.open svg{transform:rotate(180deg)}
.exp{overflow:hidden;display:flex;flex-direction:column;gap:12px;flex:none}
.tonal{height:48px;padding:0 18px;border-radius:12px;background:var(--panelHigh);border:1px solid var(--hair);font:500 13px var(--sans);flex:1}
.glabel{font:500 13px/20px var(--sans);color:var(--soft);margin-top:8px;flex:none}
.field{height:56px;border-radius:4px;border:1px solid #6a6a6c;color:var(--on);padding:0 16px;font:16px var(--sans);flex:none;outline-color:var(--accent);width:100%}
.ls{flex:none}
.ls .top{display:flex;align-items:center;min-height:48px}
.ls .lb{flex:1;font:14px/22px var(--sans)}
.ls .val{font:500 13px var(--mono);color:var(--on);padding:0 6px}
.ls .rs{width:48px;height:48px;display:grid;place-items:center;visibility:hidden}
.ls.changed .rs{visibility:visible}
.ls .rs svg{width:20px;height:20px;stroke:var(--soft);fill:none;stroke-width:1.8;stroke-linecap:round}
.ls canvas{display:block;width:100%;height:36px;touch-action:pan-y}
.ls .ends{display:flex;justify-content:space-between;font:12px/18px var(--sans);color:var(--soft);padding:0 4px}
.ls.dis{opacity:.5}
.dial{flex:none;position:relative;outline:none}
.dial canvas{display:block;width:100%;height:74px;touch-action:pan-y;cursor:grab}
.dial:focus-visible canvas{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
.curve{position:relative;height:220px;flex:none;border-radius:12px;background:#121214;touch-action:none}
.curve canvas,.pad canvas{width:100%;height:100%;display:block}
.pad{position:relative;height:200px;flex:none;border-radius:12px;overflow:hidden;touch-action:none}
.swatches{display:flex;gap:10px;flex:none;padding:6px 2px}
.swatches button{width:30px;height:30px;border-radius:15px;position:relative;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.swatches button.on{transform:scale(1.12);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}

/* overlays */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s var(--fx);z-index:70}
#scrim.on{opacity:1;pointer-events:auto}
.menu{position:absolute;z-index:80;min-width:210px;max-width:340px;background:#29292b;border-radius:12px;padding:8px 0;box-shadow:0 10px 36px rgba(0,0,0,.55);
  transform-origin:top right;opacity:0;transform:scale(.9);pointer-events:none;transition:opacity .12s var(--fx),transform .24s cubic-bezier(.3,1.25,.5,1)}
.menu.on{opacity:1;transform:none;pointer-events:auto}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:0 16px;height:48px;font:14px/48px var(--sans);white-space:nowrap;overflow:hidden}
.menu button small{margin-left:auto;color:var(--soft);font-size:12px}
.menu button:active{background:rgba(255,255,255,.08)}
.menu button[disabled]{opacity:.38}
.menu .sep{height:1px;background:var(--hair);margin:6px 0}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:80;background:var(--panel);border-radius:24px 24px 0 0;padding:12px 20px 40px;transform:translateY(105%)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--outline);margin:0 auto 14px}
.sheet h4{margin:0 0 14px;font:500 15px/22px var(--sans)}
.sheet .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

<script>
'use strict';
/* ?step: a manual clock for checking animations frame by frame (window.__tick(ms) advances it) */
if(new URLSearchParams(location.search).has('step')){ let T=performance.now(),id=1; const raf=new Map(),tm=new Map();
  performance.now=()=>T; window.requestAnimationFrame=f=>{const i=id++;raf.set(i,f);return i}; window.cancelAnimationFrame=i=>raf.delete(i);
  window.setTimeout=(f,ms)=>{const i=id++;tm.set(i,{at:T+(ms||0),f});return i}; window.clearTimeout=i=>tm.delete(i);
  window.__tick=async ms=>{const end=T+ms;while(T<end){T+=16;for(const [i,t] of [...tm])if(t.at<=T){tm.delete(i);t.f()}const fs=[...raf.values()];raf.clear();fs.forEach(f=>f(T));await Promise.resolve();await Promise.resolve()}return T}; }
/* =====================================================================
 * Basics
 * ===================================================================*/
const $=id=>document.getElementById(id);
const now=()=>performance.now();
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const smooth=(e0,e1,x)=>{const v=clamp((x-e0)/(e1-e0),0,1);return v*v*(3-2*v)};
const ease=t=>1-Math.pow(1-clamp(t,0,1),3);
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const cap=(el,id)=>{try{el.setPointerCapture(id)}catch(_){}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms*SLOW));
/* ?slow=8 plays the animations eight times slower, to judge them frame by frame */
const SLOW=Math.max(1,Number(new URLSearchParams(location.search).get('slow'))||1);

const PAL = {codex:{bg:'#0E0E10',surface:'#141416',panel:'#1D1D1F',panelHigh:'#262628',on:'#EBEBEB',soft:'#A8A8A8',track:'#6A6A6C',accent:'#F2F2F2',onAccent:'#111113',outline:'#3A3A3C'},
  polish:{bg:'#0F0F0E',surface:'#0F0F0E',panel:'#191918',panelHigh:'#232321',on:'#ECE9E3',soft:'#9E9A92',track:'#56544F',accent:'#EEEAE2',onAccent:'#161614',outline:'#3B3A37'}};
let P=PAL.polish;
const LIGHT={graphite:[0x5E,0x5A,0x53],silver:[0xB5,0xB1,0xA8],ivory:[0xEE,0xEA,0xE2],amber:[0xB5,0x76,0x3C]};
const AURA={blue:[0x31,0x86,0xFF],teal:[0x24,0xA2,0xCA],red:[0xFC,0x41,0x3D],yellow:[0xFB,0xBC,0x04],green:[0x00,0xB9,0x5C]};
const SPECTRUM=[[0,AURA.blue],[.25,AURA.teal],[.5,AURA.green],[.72,AURA.yellow],[1,AURA.red]];
const Motion={ // Theme.kt + Interactions.kt
  fastSpatial:{d:.6,k:800}, defaultSpatial:{d:.8,k:380}, slowSpatial:{d:.8,k:200},
  fastEffects:{d:1,k:3800}, defaultEffects:{d:1,k:1600}, slowEffects:{d:1,k:800},
};
const FLIPS=3, FLIP_MS=100, STAGGER_MS=35, POOL='AEKLMNRSTX-', NAME='Spektralab-X', PITCH=10.56;
const splitFlapMs=t=>Math.max(0,t.length-1)*STAGGER_MS+FLIPS*FLIP_MS;

/* =====================================================================
 * Spring solver: unit mass, Compose's dampingRatio / stiffness
 * ===================================================================*/
class Spring{
  constructor(v=0){this.v=v;this.vel=0;this.target=v;this.raf=0;this.spec=Motion.defaultSpatial}
  animateTo(target,spec,onFrame,onEnd,{velocity,threshold=.001}={}){
    this.target=target;this.spec=spec||this.spec;if(velocity!==undefined)this.vel=velocity;this.onFrame=onFrame;this.onEnd=onEnd;this.th=threshold;
    if(!this.raf){this.last=now();this.raf=requestAnimationFrame(this._step)} return this;
  }

  stop(){cancelAnimationFrame(this.raf);this.raf=0}
  _step=()=>{
    const t=now(),dt=Math.min(.064,(t-this.last)/1000)/SLOW;this.last=t;

    const fm=h('div',{class:'fmts'});F.forEach(([n,d],i)=>{const b=h('button',{class:'fmt'+(EXPORT.fmt===i?' on':''),role:'radio','aria-checked':EXPORT.fmt===i},h('b',{},n),h('small',{},d));b.onclick=()=>{if(EXPORT.fmt===i)return;EXPORT.fmt=i;FB.emit('detentMajor',{src:n});build()};fm.append(pressable(b,.96))});sh.append(fm);
    const opts=EXPORT.fmt===2?['sRGB','Display P3','ProPhoto RGB']:['原尺寸','适合分享'],key=EXPORT.fmt===2?'space':'size';
    sh.append(Seg(opts,EXPORT[key],i=>{EXPORT[key]=i;FB.emit('detent',{src:opts[i]});build()}));
    const go=h('button',{class:'primary',style:'width:100%;margin-top:18px'},'保存');go.onclick=()=>{closeOverlays();exportPhoto(F[EXPORT.fmt][0]+' '+opts[EXPORT[key]])};sh.append(pressable(go,.97))};
  build(); sh._open=true; $('scrim').classList.add('on'); tween(Motion.defaultSpatial,1,0,v=>sh.style.transform=`translateY(${v*105}%)`);
}
$('save').onclick=()=>{if(!S.photo)return;
  if(V.polish){openExportSheet();return}
  const items=V.polish?[{label:'JPEG',note:'标准尺寸'},{label:'JPEG',note:'适合分享'},{sep:1},{label:'TIFF 16 位',note:'sRGB'},{label:'TIFF 16 位',note:'Display P3'},{label:'TIFF 16 位',note:'ProPhoto RGB'},{sep:1},{label:'HEIF',note:'标准尺寸'},{label:'最高画质',note:'较慢'}]

async function openPhoto(s){

const COACH=['点风格套用，再点一次调强度','按住照片看原图','双击滑杆归零','导出到相册']; // Coach.kt; 打磨版 drops it
function startCoach(){S.coach=0;showCoach()}
function showCoach(){const c=$('coach');if(S.coach>=COACH.length||V.polish){c.style.display='none';S.coachDone=true;return}
  $('coachText').textContent=COACH[S.coach];$('coachIdx').textContent=`${S.coach+1}/${COACH.length}`;c.style.display='block';c.style.top=[480,180,560,680][S.coach]+'px'}
$('coachNext').onclick=()=>{S.coach++;showCoach()};$('coachSkip').onclick=()=>{S.coach=99;showCoach()};
let snackTimer=0;
function snack(text,action,act){const s=$('snack');$('snackText').textContent=text;const b=$('snackAct');b.textContent=action||'';b.style.display=action?'':'none';
  b.onclick=()=>{s.classList.remove('on');act&&act()};s.classList.add('on');clearTimeout(snackTimer);snackTimer=setTimeout(()=>s.classList.remove('on'),action?4500:2400)}
const Z={s:1,x:0,y:0,rx:0,ry:0,sp:null};
function applyZoom(){$('stage').style.transform=(Z.s===1&&!Z.x&&!Z.y)?'':`translate(${Z.x}px,${Z.y}px) scale(${Z.s})`}
function zoomLimits(sc){const a=$('photoArea').getBoundingClientRect(),f=$('frame').getBoundingClientRect(),bw=f.width/Z.s,bh=f.height/Z.s;
  return [Math.max(0,(bw*sc-a.width)/2+16),Math.max(0,(bh*sc-a.height)/2+16)]}
const rubber=(v,l)=>Math.abs(v)<=l?v:Math.sign(v)*(l+(Math.abs(v)-l)*.3);
function zoomAnim(s1,x1,y1){const s0=Z.s,x0=Z.x,y0=Z.y;if(Z.sp)Z.sp.stop();Z.sp=new Spring(0);
  Z.sp.animateTo(1,Motion.defaultSpatial,k=>{Z.s=lerp(s0,s1,k);Z.x=lerp(x0,x1,k);Z.y=lerp(y0,y1,k);applyZoom()},()=>{Z.rx=Z.x;Z.ry=Z.y;renderChips()},{threshold:.0015})}
function zoomOne(){const w=$('pic').getBoundingClientRect().width/Z.s;return clamp((photoImg?.naturalWidth||800)/w,1.8,3)}
function zoomToggle(cx,cy){ // cx, cy: the screen point to keep under the finger
  const a=$('photoArea').getBoundingClientRect(),P=[cx-(a.left+a.width/2),cy-(a.top+a.height/2)];
  if(Z.s>1.01){FB.emit('detentMajor',{src:'适应屏幕'});zoomAnim(1,0,0);return}
  const s1=zoomOne(),C=[(P[0]-Z.x)/Z.s,(P[1]-Z.y)/Z.s],[lx,ly]=zoomLimits(s1);
  FB.emit('detentMajor',{src:'1:1'});zoomAnim(s1,clamp(P[0]-C[0]*s1,-lx,lx),clamp(P[1]-C[1]*s1,-ly,ly));
}
function zoomReset(){if(Z.sp)Z.sp.stop();Z.s=1;Z.x=Z.y=Z.rx=Z.ry=0;applyZoom()}
(function(){ // the photo: hold for the original, tap to hide the controls, double tap for 1:1, drag to pan
  const area=$('photoArea');let t=0,held=false,downAt=0,sx=0,sy=0,px=0,py=0,id=null,panning=false,lastTap=0,tapTimer=0;
  area.addEventListener('pointerdown',e=>{if(!S.photo||e.target.closest('.ochip'))return;id=e.pointerId;downAt=now();sx=px=e.clientX;sy=py=e.clientY;held=false;panning=false;
    if(Z.sp)Z.sp.stop();Z.rx=Z.x;Z.ry=Z.y;
    t=setTimeout(()=>{held=true;xfade(Motion.fastEffects);compareOn=true;drawPhoto();$('holdTag').style.display='block';FB.emit('hold',{src:'按住看原图'})},220)});
  area.addEventListener('pointermove',e=>{if(e.pointerId!==id||held)return;
    if(Math.hypot(e.clientX-sx,e.clientY-sy)>8){clearTimeout(t);if(Z.s>1.01){if(!panning){panning=true;cap(area,id)}
      const [lx,ly]=zoomLimits(Z.s);Z.rx+=e.clientX-px;Z.ry+=e.clientY-py;Z.x=rubber(Z.rx,lx);Z.y=rubber(Z.ry,ly);applyZoom()}}
    px=e.clientX;py=e.clientY});
  const up=e=>{if(e.type!=='leave'&&e.pointerId!==id)return;id=null;clearTimeout(t);if(!S.photo)return;
    if(held){held=false;xfade(Motion.fastEffects);compareOn=false;drawPhoto();$('holdTag').style.display='none';FB.emit('release',{src:'松开'});return}
    if(panning){panning=false;const [lx,ly]=zoomLimits(Z.s);const tx=clamp(Z.x,-lx,lx),ty=clamp(Z.y,-ly,ly);if(tx!==Z.x||ty!==Z.y)zoomAnim(Z.s,tx,ty);else{Z.rx=Z.x;Z.ry=Z.y}return}
    if(e.type==='pointerup'&&now()-downAt<250&&Math.hypot(e.clientX-sx,e.clientY-sy)<8&&!e.target.closest('.ochip')){
      if(!V.polish){toggleChrome();return}
      if(now()-lastTap<300){clearTimeout(tapTimer);lastTap=0;zoomToggle(e.clientX,e.clientY);return}
      lastTap=now();tapTimer=setTimeout(toggleChrome,300)}};
  area.addEventListener('pointerup',up);area.addEventListener('pointercancel',up);area.addEventListener('pointerleave',()=>{if(held)up({type:'leave'})});
})();
function toggleChrome(){S.chrome=!S.chrome;const show=S.chrome;
  tween(Motion.defaultEffects,show?0:1,show?1:0,v=>{$('topbar').style.opacity=v;$('bar').style.opacity=v});$('topbar').style.pointerEvents=$('bar').style.pointerEvents=show?'':'none';
  setPanel(show?1:0);if(!show&&!V.polish)snack('轻点照片恢复界面')}
(function(){ // panel height: drag the handle; a fling picks the next height
  const hd=$('handle');let id=null,sy=0,sh=0,hist=[];
  hd.addEventListener('pointerdown',e=>{id=e.pointerId;cap(hd,id);sy=e.clientY;sh=$('panel').getBoundingClientRect().height;hist=[[now(),e.clientY]];panelSpring.stop();FB.emit('hold',{src:'面板'})});
  hd.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;const H=PANEL_H(),v=clamp(sh-(e.clientY-sy),H[0],H[2]);panelSpring.v=v;$('panel').style.height=v+'px';layoutPhoto();hist.push([now(),e.clientY]);if(hist.length>6)hist.shift()});
  hd.addEventListener('pointerup',e=>{if(e.pointerId!==id)return;id=null;const [t0,y0]=hist[0],[t1,y1]=hist[hist.length-1],vel=t1>t0?-(y1-y0)/(t1-t0)*1000:0;
    const at=panelSpring.v+vel*.12,H=PANEL_H();let best=0,bd=1e9;H.forEach((p,i)=>{if(Math.abs(p-at)<bd){bd=Math.abs(p-at);best=i}});
    if(best!==S.panelLevel)FB.emit('segment',{src:'面板高度'});setPanel(best,vel)});
})();
