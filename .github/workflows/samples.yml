name: samples

# Renders the project site's photos (tools/samples/hires.sh) through the pinned,
# patched engine on lavapipe, the same build as scripts/parity.sh. Artifact only;
# nothing is committed. docs/SAMPLES.md says what the renders are.
on:
  workflow_dispatch:
    inputs:
      edge:
        description: Long edge in px
        default: '3200'
  push:
    paths:
      - .github/workflows/samples.yml
      - tools/samples/hires.sh

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      THREADS: '4'
      LP_NUM_THREADS: '4'
      EDGE: ${{ github.event.inputs.edge || '3200' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm glslang-tools mesa-vulkan-drivers libvulkan1 \
            libvulkan-dev ninja-build zlib1g-dev
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q meson==1.9.2 'ninja>=1.13,<1.14' numpy
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            upstream
            deps
          key: samples-${{ hashFiles('scripts/fetch-upstream.sh', 'patches/*.patch') }}
      - name: Upstream and codecs
        run: |
          bash scripts/fetch-upstream.sh upstream
          UP="$PWD/upstream"; D="$PWD/deps"
          if [[ ! -f "$D/.done" ]]; then
            bash "$UP/engine/setup-codecs.sh" "$D/export-codecs" >/dev/null
            python3 "$UP/engine/setup-input-codecs.py" --sources "$D/input-codecs" --build "$RUNNER_TEMP/b-input" \
              --install "$D/input-codecs/install-linux" --generator Ninja --jobs "$THREADS"
            python3 "$UP/engine/setup-lens-codecs.py" --sources "$D/lens-codecs" --build "$RUNNER_TEMP/b-lens" \
              --install "$D/lens-codecs/install-linux" --generator Ninja --jobs "$THREADS"
            touch "$D/.done"
          fi
      - name: Engine (as scripts/parity.sh builds it)
        run: |
          UP="$PWD/upstream"; D="$PWD/deps"; L="$RUNNER_TEMP/libraw-spk"; B="$PWD/build-host"
          cp -a "$UP/build/deps/LibRaw-0.22.2" "$L"
          for p in $(ls patches/libraw/*.patch | sort); do patch -d "$L" -p1 --forward --batch -i "$PWD/$p" >/dev/null; done
          cmake -S "$UP" -B "$B" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSPEKTRALAB_BUILD_NATIVE_RAW=ON -DSPEKTRALAB_BUILD_HOST=ON -DSPEKTRALAB_REQUIRE_VULKAN=ON \
            -DSPEKTRALAB_STATIC_RUNTIME=ON -DSPEKTRALAB_DEPS_DIR="$UP/build/deps" \
            -DSPEKTRALAB_LIBRAW_SOURCE="$L" \
            -DSPEKTRALAB_CODECS_DIR="$D/export-codecs" \
            -DSPEKTRALAB_INPUT_CODEC_PREFIX="$D/input-codecs/install-linux" \
            -DSPEKTRALAB_LENS_PREFIX="$D/lens-codecs/install-linux" \
            -DBUILD_TESTING=OFF -DSPEKTRALAB_HOST_VERSION=samples >/dev/null
          ninja -C "$B" -j "$THREADS" spektralab-host
          echo "--- static libraries"; find "$B" -name '*.a' | sort
      - name: spk_render
        run: |
          UP="$PWD/upstream"; B="$PWD/build-host"
          libs=$(find "$B" "$PWD/deps" -name '*.a' | grep -v -e '/test' -e 'gtest' | sort | tr '\n' ' ')
          g++ -O2 -std=c++20 -fopenmp tools/samples/spk_render.cpp \
            -I"$UP/engine/third_party/stb" -I"$UP/engine/include" -I"$UP/engine/src" \
            -I"$UP/build/deps/LibRaw-0.22.2" -o spk_render \
            -Wl,--start-group $libs -Wl,--end-group -lvulkan -lz -ldl -lpthread
          ls -la spk_render
      - name: CC0 RAWs (docs/SAMPLES.md), checked against their SHA-256
        run: |
          mkdir -p work/raw
          while read -r sha url; do
            name="$(basename "$url")"; f="work/raw/${name// /_}"
            for i in 1 2 3 4 5; do
              curl -fsSL --retry 3 -C - -o "$f.part" "${url// /%20}" || true
              [[ "$(sha256sum "$f.part" | cut -d' ' -f1)" == "$sha" ]] && break
            done
            [[ "$(sha256sum "$f.part" | cut -d' ' -f1)" == "$sha" ]] || { echo "checksum mismatch: $name"; exit 1; }
            mv "$f.part" "$f"
          done <<'EOF'
          f7b2a6b6d7684536511cf2db2e2bfa46fae1ad7e52214093714f35e7ca60acbf https://raw.pixls.us/getfile.php/1797/nice/Leica - Q (Typ 116) - 14bit (3:2).DNG
          10a1116bd00e92314b09382b403f76706b1eeab3ce33234a6c75fe25ed289756 https://raw.pixls.us/getfile.php/4691/nice/Canon - EOS R5 - RAW, 1.6 crop, dual-pixel (3:2).CR3
          05513ee72f7cac4165534c9f64995412084f414a033c80c473c79fd94154292e https://raw.pixls.us/getfile.php/3115/nice/Ricoh - GR III - 14bit (3:2).DNG
          5541093a369f0487fef92bcd1f5fef1be6e4e3cec2aa4d52ad38d2211f3309d7 https://raw.pixls.us/getfile.php/2206/nice/Google - Pixel 2 XL - 16bit (4:3).dng
          bca8ad027b0ee0038107c01792ccb5c6b776512b77b584c6f93c6f2ced5f15a3 https://raw.pixls.us/getfile.php/1936/nice/Fujifilm - X100F - 14bit 14bit compressed (3:2).RAF
          EOF
      - name: Render
        run: |
          cd work
          R="$PWD/../build-host/engine/resources" T="$PWD/../spk_render" bash ../tools/samples/hires.sh
          ! grep -q FAIL out/index.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-renders-${{ env.EDGE }}
          path: |
            work/out/*.png
            work/out/index.txt
            work/out/*.err
          compression-level: 0
