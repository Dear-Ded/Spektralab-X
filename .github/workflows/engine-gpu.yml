name: engine-gpu

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      SPEKTRALAB_RAW_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Decoder tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build zlib1g-dev
      - uses: actions/cache@v6
        with:
          path: upstream
          key: upstream-${{ hashFiles('scripts/fetch-upstream.sh', 'patches/*.patch') }}
      - name: Fetch and patch decoder
        run: |
          bash scripts/fetch-upstream.sh upstream
          cp -a upstream/build/deps/LibRaw-0.22.2 "$RUNNER_TEMP/raw-libraw"
          sed -i 's/\r$//' "$RUNNER_TEMP/raw-libraw/src/decoders/crx.cpp"
          for p in patches/libraw/*.patch; do
            patch -d "$RUNNER_TEMP/raw-libraw" -p1 --fuzz=0 --forward --batch < "$p"
          done
      - name: Build complete sanitized decoder
        run: |
          cmake -S tools/native/float_dng_deflate_host -B raw-storage-build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSPK_UPSTREAM="$PWD/upstream" \
            -DSPEKTRALAB_LIBRAW_SOURCE="$RUNNER_TEMP/raw-libraw" \
            -DSPK_BUILD_RAW_COLOR_AUDIT=ON \
            -DCMAKE_CXX_FLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -ffp-contract=off"
          cmake --build raw-storage-build -j2
      - name: Check decoder storage and cancellation
        run: |
          mkdir -p raw-storage-evidence
          python3 tools/native/linear_raw_black_regression.py raw-black-oracle \
            --probe "$PWD/raw-storage-build/raw_color_audit" \
            > raw-storage-evidence/black-oracle.log 2>&1
          cp raw-black-oracle/results.json raw-storage-evidence/black-oracle.json
          UP="$PWD/upstream" B="$PWD/raw-storage-build" SANITIZE=1 BUILD_DIR="$PWD/raw-dispatch" \
            bash tools/native/run_raw_precision_input.sh > raw-storage-evidence/dispatch.log 2>&1
          python3 tools/native/raw_working_fixtures.py raw-fixtures
          B="$PWD/raw-storage-build" SANITIZE=1 BUILD_DIR="$PWD/raw-lifetime" \
            bash tools/native/run_raw_storage_lifetime.sh raw-fixtures/*.dng \
            raw-dispatch/fixtures/fallback-crop.dng > raw-storage-evidence/lifetime.log 2>&1
          B="$PWD/raw-storage-build" SANITIZE=1 BUILD_DIR="$PWD/raw-linear-move" \
            bash tools/native/run_raw_linear_move.sh raw-fixtures/integer-orientation-*.dng \
            raw-fixtures/integer-bayer-orientation-*.dng raw-fixtures/integer-lossless-orientation-*.dng \
            raw-dispatch/fixtures/fallback-crop.dng \
            > raw-storage-evidence/linear-move.log 2>&1
          UP="$PWD/upstream" B="$PWD/raw-storage-build" SANITIZE=1 BUILD_DIR="$PWD/raw-working" \
            bash tools/native/run_raw_working_decode.sh raw-fixtures/*.dng \
            raw-dispatch/fixtures/max2.dng raw-dispatch/fixtures/fallback-crop.dng \
            > raw-storage-evidence/working.log 2>&1
          cp raw-dispatch/fixtures/results.json raw-storage-evidence/dispatch.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-storage
          path: raw-storage-evidence/
  fir-rows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SPEKTRAFILM_VULKAN_STRICT_LIMITS: '1'
      LP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Vulkan tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools mesa-vulkan-drivers ninja-build
      - uses: actions/cache@v6
        with:
          path: upstream
          key: upstream-${{ hashFiles('scripts/fetch-upstream.sh', 'patches/*.patch') }}
      - name: Fetch upstream
        run: bash scripts/fetch-upstream.sh upstream
      - name: Compare Sony Huffman cache indices
        run: |
          mkdir -p fir-evidence
          LIBRAW_SOURCE="$PWD/upstream/build/deps/LibRaw-0.22.2" \
            BUILD_DIR="$PWD/huffman-tests" SANITIZE=1 \
            bash tools/native/run_libraw_huffman_cache.sh > fir-evidence/huffman.log 2>&1
          cp huffman-tests/inputs.sha256 fir-evidence/huffman-inputs.sha256
          cat fir-evidence/huffman.log
      - name: Check RGBA16 export integrity
        run: BUILD_DIR="$PWD/frame-tests" bash tools/native/run_rgba16_frame_check.sh
      - name: Compare streamed RGB16 working input
        run: |
          mkdir -p fir-evidence
          BUILD_DIR="$PWD/rgb16-tests" SANITIZE=1 bash tools/native/run_rgb16_resize.sh > fir-evidence/rgb16.log 2>&1
          cat fir-evidence/rgb16.log
      - name: Compare prepared view curves
        run: |
          mkdir -p fir-evidence
          UP="$PWD/upstream" BUILD_DIR="$PWD/curve-tests" bash tools/native/run_view_curve.sh
          cp curve-tests/curves.csv fir-evidence/curves.csv
          cp curve-tests/curves.log fir-evidence/curves.log
      - name: Build Vulkan engine
        run: |
          cmake -S upstream -B build-fir -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF -DSPEKTRALAB_REQUIRE_VULKAN=ON \
            -DSPEKTRALAB_BUILD_NATIVE_RAW=OFF -DSPEKTRALAB_BUILD_HOST=OFF \
            -DSPEKTRALAB_BUILD_DESKTOP=OFF -DSPEKTRALAB_BUILD_TEST_DLL=OFF
          cmake --build build-fir --target spektralab_engine -j2
      - name: Compare exact meter and scene order statistics
        run: |
          mkdir -p fir-evidence
          cp -a upstream "$RUNNER_TEMP/order-frozen"
          patch -d "$RUNNER_TEMP/order-frozen" -p1 --reverse --fuzz=0 --batch \
            < patches/0059-exact-multiple-order-statistics.patch
          UP="$PWD/upstream" B="$PWD/build-fir" BASELINE_UP="$RUNNER_TEMP/order-frozen" \
            BUILD_DIR="$PWD/order-tests" SANITIZE=1 \
            bash tools/native/run_order_statistics.sh > fir-evidence/order-statistics.log 2>&1
          sha256sum order-tests/baseline.csv order-tests/candidate.csv \
            > fir-evidence/order-statistics.sha256
      - name: Exercise Vulkan view curves
        run: |
          UP="$PWD/upstream" B="$PWD/build-fir" BUILD_DIR="$PWD/curve-gpu-tests" \
            bash tools/native/run_view_curve_gpu.sh
          cp curve-gpu-tests/candidate.csv fir-evidence/curve-gpu.csv
          cp curve-gpu-tests/inputs.sha256 fir-evidence/curve-gpu-inputs.sha256
      - name: Check probe resource lifetime
        run: |
          mkdir -p fir-evidence
          UP="$PWD/upstream" BUILD_DIR="$PWD/probe-tests" \
            bash tools/native/run_probe_lifetime.sh > fir-evidence/probe.log 2>&1
          ./probe-tests/storage_probe_lifetime --smoke >> fir-evidence/probe.log 2>&1
          cat fir-evidence/probe.log
      - name: Reject non-finite Vulkan output
        run: |
          UP="$PWD/upstream" B="$PWD/build-fir" BUILD_DIR="$PWD/finite-tests" \
            SPEKTRAFILM_VULKAN_FORCE_SPLIT=1 \
            bash tools/native/run_finite_output.sh > fir-evidence/finite.log 2>&1
          cp finite-tests/candidate.csv finite-tests/inputs.sha256 fir-evidence/
          cat fir-evidence/finite.log
      - name: Compare full-plane and row FIR bytes
        run: |
          mkdir -p fir-evidence
          UP="$PWD/upstream" B="$PWD/build-fir" BUILD_DIR="$PWD/fir-tests" \
            bash tools/native/run_fir_rows.sh > fir-evidence/fir.csv 2> fir-evidence/fir.log
          cat fir-evidence/fir.log fir-evidence/fir.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fir-rows-${{ github.sha }}
          path: fir-evidence/
