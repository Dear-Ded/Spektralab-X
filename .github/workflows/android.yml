name: android

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "fastlane/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/*.md"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "fastlane/**"
  workflow_dispatch:

permissions:
  contents: write      # create the release
  id-token: write      # build provenance attestation
  attestations: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools unzip

      - name: Cache upstream sources
        uses: actions/cache@v4
        with:
          path: upstream
          key: upstream-${{ hashFiles('scripts/fetch-upstream.sh', 'patches/*.patch') }}

      - name: Fetch upstream
        run: bash scripts/fetch-upstream.sh upstream

      - name: Stage engine assets
        run: bash scripts/stage-assets.sh upstream

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SPK_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_B64 is not set; the APK is signed with a throwaway debug key"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        env:
          SPK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SPK_UPSTREAM: ${{ github.workspace }}/upstream
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Version
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          if gh release view "v$v" >/dev/null 2>&1; then echo "PUBLISH=0" >> "$GITHUB_ENV"; else echo "PUBLISH=1" >> "$GITHUB_ENV"; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rename APK and checksum
        run: |
          mkdir -p dist
          apk="SpektraLab-$APP_VERSION-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/$apk"
          (cd dist && sha256sum "$apk" > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: SpektraLab-${{ env.APP_VERSION }}-run${{ github.run_number }}
          path: dist/*

      # A release is published only when VERSION names a version not yet
      # released; other pushes leave an artifact on the run and nothing else.
      - name: Build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PUBLISH == '1'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.apk

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PUBLISH == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release-notes.sh "$APP_VERSION" dist "${{ github.repository }}" "${{ github.sha }}" > notes.md
          gh release create "v$APP_VERSION" dist/*.apk dist/SHA256SUMS \
            --title "SpektraLab Android $APP_VERSION" --notes-file notes.md --prerelease
